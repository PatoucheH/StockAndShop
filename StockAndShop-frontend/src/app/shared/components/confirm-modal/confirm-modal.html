<div class="fixed inset-0 z-40 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4"
     (click)="cancelled.emit()">
  <div class="w-full max-w-sm bg-white rounded-2xl shadow-2xl" (click)="$event.stopPropagation()">
    <div class="p-6">
      <div class="w-11 h-11 rounded-full bg-red-50 flex items-center justify-center mx-auto mb-4">
        <svg class="w-5 h-5 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/>
        </svg>
      </div>
      <p class="text-center text-gray-700 text-sm leading-relaxed mb-6">{{ message() }}</p>
      <div class="flex gap-3">
        <button (click)="cancelled.emit()"
                class="flex-1 px-4 py-2.5 rounded-xl text-sm font-medium text-gray-700
                       border border-gray-200 hover:bg-gray-50 transition-colors cursor-pointer">
          {{ cancelLabel() }}
        </button>
        <button (click)="confirmed.emit()"
                class="flex-1 px-4 py-2.5 rounded-xl text-sm font-semibold text-white
                       bg-red-500 hover:bg-red-600 transition-colors cursor-pointer">
          {{ confirmLabel() }}
        </button>
      </div>
    </div>
  </div>
</div>
