<div class="bg-gray-50 dark:bg-gray-700/50 rounded-xl px-4 py-3 space-y-1.5">
  <div class="flex items-center justify-between gap-2">
    <span class="text-sm font-semibold text-gray-800 dark:text-gray-200 capitalize">
      {{ displayName() }}
    </span>
    <div class="flex items-center gap-0.5 shrink-0">
      @for (filled of stars(); track $index) {
        <svg class="w-3.5 h-3.5" [class]="filled ? 'text-amber-400' : 'text-gray-300 dark:text-gray-600'"
             fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
        </svg>
      }
    </div>
  </div>
  <p class="text-sm text-gray-600 dark:text-gray-300 leading-relaxed">{{ comment().comment }}</p>
  <p class="text-xs text-gray-400 dark:text-gray-500">{{ comment().createdAt | date:'dd/MM/yyyy' }}</p>
</div>
