<div class="fixed top-4 left-1/2 -translate-x-1/2 z-[9999] flex flex-col gap-2 w-[90%] max-w-sm pointer-events-none">
  @for (toast of toasts(); track toast.id) {
    <div
      class="flex items-start justify-between gap-3 px-4 py-3 rounded-lg shadow-lg pointer-events-auto text-sm font-medium"
      [ngClass]="{
        'bg-green-100 text-green-800 border border-green-200': toast.type === 'success',
        'bg-red-100 text-red-800 border border-red-200': toast.type === 'error',
        'bg-blue-100 text-blue-800 border border-blue-200': toast.type === 'info',
        'bg-yellow-100 text-yellow-800 border border-yellow-200': toast.type === 'warning'
      }"
    >
      <span class="flex-1">{{ toast.message }}</span>
      <button
        type="button"
        (click)="toastService.dismiss(toast.id)"
        class="shrink-0 text-lg leading-none opacity-60 hover:opacity-100 transition-opacity cursor-pointer"
      >×</button>
    </div>
  }
</div>
