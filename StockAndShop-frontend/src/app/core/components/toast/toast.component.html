<div class="fixed top-4 left-1/2 -translate-x-1/2 z-[9999] flex flex-col gap-2 w-[90%] max-w-sm pointer-events-none">
  @for (toast of toasts(); track toast.id) {
    <div class="flex items-center justify-between gap-3 px-4 py-3 rounded-xl shadow-lg pointer-events-auto text-sm font-medium"
         [ngClass]="{
           'bg-emerald-600 text-white': toast.type === 'success',
           'bg-red-500 text-white': toast.type === 'error',
           'bg-blue-600 text-white': toast.type === 'info',
           'bg-amber-500 text-white': toast.type === 'warning'
         }">
      <span class="flex-1 leading-snug">{{ toast.message }}</span>
      <button type="button" (click)="toastService.dismiss(toast.id)"
              class="shrink-0 opacity-70 hover:opacity-100 transition-opacity cursor-pointer text-lg leading-none">
        ×
      </button>
    </div>
  }
</div>
