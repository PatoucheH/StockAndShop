<header class="sticky top-0 z-50 shadow-md"
        style="background: linear-gradient(135deg, #064e3b 0%, #065f46 40%, #047857 70%, #059669 100%);">
  <!-- Desktop header: logo, nav links, theme toggle, logout -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
    <a routerLink="/" class="flex items-center gap-2 shrink-0">
      <span class="font-bold text-white text-lg tracking-tight">
        Stock<span class="text-emerald-300">&</span>Shop
      </span>
    </a>
    <nav class="hidden nav:flex items-center gap-1">
      <a routerLink="/" [routerLinkActiveOptions]="{exact: true}"
         routerLinkActive="!text-white bg-white/15 font-semibold"
         class="px-4 py-2 rounded-lg text-sm font-medium text-emerald-100 hover:text-white hover:bg-white/10 transition-colors">
        Accueil
      </a>
      <a routerLink="/recipes"
         routerLinkActive="!text-white bg-white/15 font-semibold"
         class="px-4 py-2 rounded-lg text-sm font-medium text-emerald-100 hover:text-white hover:bg-white/10 transition-colors">
        Recettes
      </a>
    </nav>
    <div class="flex items-center gap-2 shrink-0">
      <button (click)="themeService.toggle()"
              class="p-2 rounded-lg text-emerald-100 hover:text-white hover:bg-white/10 transition-colors"
              [title]="themeService.isDark() ? 'Mode clair' : 'Mode sombre'">
        @if (themeService.isDark()) {
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
          </svg>
        } @else {
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
          </svg>
        }
      </button>
      <button (click)="disconnect()"
              class="hidden nav:flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium
                     text-emerald-100 hover:text-white hover:bg-white/10 transition-colors">
        <i class="fa-solid fa-right-from-bracket text-sm"></i>
        Déconnecter
      </button>
      <button (click)="disconnect()"
              class="nav:hidden p-2 rounded-lg text-emerald-100 hover:text-white hover:bg-white/10 transition-colors">
        <i class="fa-solid fa-right-from-bracket"></i>
      </button>
      <button class="nav:hidden p-2 rounded-lg text-emerald-100 hover:text-white hover:bg-white/10 transition-colors"
              (click)="isMenuOpen.update(v => !v)">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          @if (isMenuOpen()) {
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          } @else {
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
          }
        </svg>
      </button>
    </div>
  </div>

  <!-- Mobile dropdown menu -->
  @if (isMenuOpen()) {
    <div class="nav:hidden border-t border-white/10" style="background: rgba(4, 47, 46, 0.97);">
      <nav class="max-w-7xl mx-auto px-4 py-3 flex flex-col gap-0.5">
        <a routerLink="/" (click)="isMenuOpen.set(false)"
           routerLinkActive="!text-white bg-white/10 font-semibold"
           [routerLinkActiveOptions]="{exact: true}"
           class="px-4 py-3 rounded-xl text-sm font-medium text-emerald-100 hover:text-white hover:bg-white/10 transition-colors">
          Accueil
        </a>
        <a routerLink="/recipes" (click)="isMenuOpen.set(false)"
           routerLinkActive="!text-white bg-white/10 font-semibold"
           class="px-4 py-3 rounded-xl text-sm font-medium text-emerald-100 hover:text-white hover:bg-white/10 transition-colors">
          Recettes
        </a>
      </nav>
    </div>
  }
</header>
