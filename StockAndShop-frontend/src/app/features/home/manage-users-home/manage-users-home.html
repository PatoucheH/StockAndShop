<div class="max-w-4xl mx-auto px-4 sm:px-6 py-5 flex flex-col gap-4">
  @if (isOwner()) {
    <div class="flex justify-end">
      <button (click)="toggleAddForm()"
              class="px-4 py-2 rounded-xl text-sm font-medium transition-colors cursor-pointer
                     {{ showAddForm()
                       ? 'bg-gray-100 text-gray-700 border border-gray-200'
                       : 'bg-emerald-600 text-white hover:bg-emerald-700' }}">
        {{ showAddForm() ? 'Annuler' : 'Inviter un membre' }}
      </button>
    </div>
    @if (showAddForm()) {
      <app-user-search-input
        [errorMessage]="errorMessage()"
        [excludedEmails]="existingEmails()"
        (submitted)="onUserSubmitted($event)"/>
    }
  }
  <app-home-member-list
    [users]="users()"
    [isOwner]="isOwner()"
    (userRemoved)="onUserRemoved($event)"/>
</div>
