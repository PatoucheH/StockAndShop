<div class="flex flex-col items-center">
  <h2 class=" text-3xl m-10 italic">TES MAISONS</h2>
    <div class="flex flex-wrap justify-center gap-8 w-full">
    @for(home of homes(); track home.id){
      <div [routerLink]="['/home', home.id]"
           class="flex flex-col justify-center items-center border border-black rounded-xl p-4 w-64 h-32
                  hover:bg-green-200 hover:scale-105 transistion all duration-300 cursor-pointer shadow-xl">
        <p class="text-lg">{{ home.name }}</p>
        <p class="text-sm">{{ home.description }}</p>
      </div>
    }
  </div>
  <button (click)="openModal()" class="bg-gradient-to-tr from-green-800 to-green-600 text-white px-3 py-1 mt-4 rounded-full
                                        hover:scale-110 transition-all duration-200">
    Créer une nouvelle maison
  </button>
</div>

@if(modalIsOpen()){
  <app-add-home (closeModal)="modalIsOpen.set(false)"/>
}
