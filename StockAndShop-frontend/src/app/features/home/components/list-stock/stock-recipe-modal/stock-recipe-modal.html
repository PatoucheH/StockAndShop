@if (recipeService.isGeneratingRecipe()) {
  <div class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center">
    <div class="bg-white dark:bg-gray-800 rounded-2xl p-8 flex flex-col items-center gap-4 shadow-2xl">
      <div class="w-10 h-10 border-2 border-emerald-200 dark:border-emerald-800 border-t-emerald-600 rounded-full animate-spin"></div>
      <p class="text-gray-600 dark:text-gray-300 text-sm font-medium">Génération des recettes...</p>
    </div>
  </div>
} @else {
  @let recipes = recipeService.newRecipes().slice(0, 5);
  @let recipe = recipes[currentIndex()];
  @if (recipe) {
    <app-recipe-card [recipe]="recipe" (close)="closed.emit()"/>
    @if (recipes.length > 1) {
      <div class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] flex items-center gap-3
                  bg-white/90 dark:bg-gray-800/90 backdrop-blur-sm rounded-full px-4 py-2 shadow-lg border border-gray-100 dark:border-gray-700">
        <button (click)="prev()" [disabled]="currentIndex() === 0"
                class="p-1 rounded-full text-gray-500 dark:text-gray-400 hover:text-gray-800 dark:hover:text-gray-200 disabled:opacity-30 disabled:cursor-not-allowed cursor-pointer transition-colors">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
          </svg>
        </button>
        <span class="text-sm font-semibold text-gray-700 dark:text-gray-200 tabular-nums">
          {{ currentIndex() + 1 }} / {{ recipes.length }}
        </span>
        <button (click)="next()" [disabled]="currentIndex() === recipes.length - 1"
                class="p-1 rounded-full text-gray-500 dark:text-gray-400 hover:text-gray-800 dark:hover:text-gray-200 disabled:opacity-30 disabled:cursor-not-allowed cursor-pointer transition-colors">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
          </svg>
        </button>
      </div>
    }
  }
}
