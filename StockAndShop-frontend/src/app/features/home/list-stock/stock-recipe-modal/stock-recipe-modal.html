@if (recipeService.isGeneratingRecipe()) {
  <div class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center">
    <div class="bg-white rounded-2xl p-8 flex flex-col items-center gap-4 shadow-2xl">
      <div class="w-10 h-10 border-2 border-emerald-200 border-t-emerald-600 rounded-full animate-spin"></div>
      <p class="text-gray-600 text-sm font-medium">Génération des recettes...</p>
    </div>
  </div>
} @else {
  @for (recipe of recipeService.newRecipes(); track recipe.id) {
    <app-recipe-card [recipe]="recipe" (close)="closed.emit()"/>
  }
}
