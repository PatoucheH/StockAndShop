<div class="fixed inset-0 z-40 bg-black/50 flex items-center justify-center" (click)="closeModal.emit()">
  <div class="flex flex-col justify-center items-center z-50 bg-green-100 border shadow-lg rounded-xl
            p-6 w-[90%] max-w-md" (click)="$event.stopPropagation()">
    <h1 class="text-xl font-semibold mb-4 text-center">Ajouter un nouveau produit à la liste</h1>
    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col items-center text-center">
      <label for="name">
        Choisissez le produit :
        <input type="text" id="name" name="name" formControlName="name" required
               class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none
             focus:ring-2 focus:ring-green-500">
      </label>
      <label for="unity">
        Entrez l'unité de votre produit :
        <select id="unity" name="unity" formControlName="unity" required>
          @for(unity of unities(); track $index){
            @switch (unity){
              @case ("MILLILITER"){
                <option [ngValue]="unity">Millilitres</option>
              }@case ("GRAMS"){
                <option [ngValue]="unity">Grammes</option>
              }@case ("JAR"){
                <option [ngValue]="unity">Pot</option>
              }@case ("BOTTLE"){
                <option [ngValue]="unity">Bouteille</option>
              }@case ("PACKET"){
                <option [ngValue]="unity">Paquet</option>
              }@case ("BOX"){
                <option [ngValue]="unity">Boite</option>
              }@case ("PIECE"){
                <option [ngValue]="unity">Pièce</option>
              }@default {
                <option [ngValue]="unity">{{ unity }}</option>
              }
            }
          }
        </select>
      </label>
      <label for="quantity">
        Entrez la quantité de produit
        <div class="flex gap-1 justify-center">
          <input type="number" id="quantity" name="quantity" formControlName="quantity" required
                 [attr.min]="isWeightOrVolume() ? '0.001' : '1'"
                 [attr.step]="isWeightOrVolume() ? 'any' : '1'"
                 class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none
               focus:ring-2 focus:ring-green-500">
          @if (isWeightOrVolume()) {
            <select (change)="subUnit.set($any($event.target).value)"
                    class="border border-gray-300 rounded-lg px-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
              @if (selectedUnity().toLowerCase() === 'grams') {
                <option value="g">g</option>
                <option value="kg">kg</option>
              } @else {
                <option value="ml">ml</option>
                <option value="L">L</option>
              }
            </select>
          }
        </div>
      </label>
      <label for="category">
        Séléctionné la catégorie
        <select name="category" id="category" formControlName="category">
          @for(cat of categories(); track cat.id){
            <option [ngValue]="cat.name">{{ cat.name}}</option>
          }
        </select>
      </label>

      <button type="submit" class="bg-green-600 text-white rounded-full
      px-6 py-2 mt-4 hover:scale-105 transition-all duration-200">Ajouter</button>
      <button type="button" (click)="closeModal.emit()" class="text-xs text-red-700">Annuler</button>
    </form>
  </div>
</div>
