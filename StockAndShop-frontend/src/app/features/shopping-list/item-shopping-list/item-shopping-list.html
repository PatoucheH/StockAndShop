<div class="rounded-xl px-3.5 py-0.5 flex items-center justify-between
           border transition-all duration-200 cursor-pointer select-none"
     [ngClass]="isChecked()
       ? 'bg-emerald-50 dark:bg-emerald-900/25 border-emerald-200 dark:border-emerald-800/50 shadow-none'
       : 'bg-white dark:bg-gray-800 border-gray-100 dark:border-gray-700 shadow-sm hover:shadow-md hover:-translate-y-px'"
     (click)="checkedItem()">

  <div class="flex items-center gap-3 min-w-0 flex-1">

    <!-- Checkbox -->
    <div class="w-5 h-5 rounded-md border-2 flex items-center justify-center transition-all duration-200 shrink-0"
         [ngClass]="isChecked()
           ? 'bg-emerald-500 border-emerald-500'
           : 'border-gray-300 dark:border-gray-500 bg-white dark:bg-gray-800'">
      @if (isChecked()) {
        <svg class="w-3 h-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
        </svg>
      }
    </div>

    <!-- Text -->
    <div class="flex flex-col min-w-0">
      <span class="font-medium text-sm truncate transition-all duration-200"
            [ngClass]="isChecked()
              ? 'line-through text-gray-400 dark:text-gray-500'
              : 'text-gray-800 dark:text-gray-200'">
        {{ item().nameProduct }}
      </span>
      <span class="text-xs transition-colors duration-200"
            [ngClass]="isChecked() ? 'text-emerald-400 dark:text-emerald-600' : 'text-gray-400 dark:text-gray-500'">
        {{ item().quantity | smartUnit:item().unityProduct }}
      </span>
    </div>

  </div>

  <!-- Delete -->
  <button (click)="$event.stopPropagation(); deleteItem()"
          class="w-6 h-6 rounded-full flex items-center justify-center shrink-0 ml-2
                 text-gray-300 dark:text-gray-600 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 transition-all cursor-pointer">
    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
    </svg>
  </button>

</div>
