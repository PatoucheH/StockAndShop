<div class="bg-white border border-green-100 rounded-2xl px-4 py-1.5 flex items-center justify-between
                 shadow-sm hover:shadow-md transition-all duration-200"
     [class.bg-gray-400]="isChecked()"
     (click)="checkedItem()">
  <div class="flex items-center gap-2" >
    <button class="w-5 h-5 rounded-full border-2 flex items-center justify-center transition-all"
      [class.bg-green-600]="isChecked()"
      [class.border-green-600]="isChecked()"
      [class.border-gray-300]="!isChecked()">
      @if (isChecked()) {
        <i class="fa-solid fa-check text-white text-[10px]"></i>
      }
    </button>
    <div class="flex items-center gap-2 flex-wrap"
         [class.line-through]="isChecked()"
         [class.text-gray-500]="isChecked()">
              <span class="font-medium text-sm">
                {{ item().nameProduct }}
              </span>
      <span class="text-xs text-gray-500">
        {{ item().quantity | smartUnit:item().unityProduct }}
      </span>
    </div>
  </div>
  <button
    (click)="$event.stopPropagation(); deleteItem()"
    class="flex items-center justify-center w-5 h-5 rounded-full bg-red-500 text-white shadow-md hover:bg-red-600
      hover:shadow-lg hover:scale-110 active:scale-95 transition-all duration-200">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"
      stroke-width="3">
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
    </svg>
  </button>
</div>
