<div class="border rounded-xl px-3 py-2 flex items-center justify-between
           shadow-sm hover:shadow transition-all duration-150 cursor-pointer select-none"
     [ngClass]="isChecked()
       ? 'bg-slate-200 dark:bg-slate-600 border-slate-200 dark:border-slate-600'
       : 'bg-white dark:bg-gray-800 border-gray-100 dark:border-gray-700'"
     (click)="checkedItem()">
  <div class="flex items-center gap-2.5 min-w-0 flex-1">
    <div class="w-4 h-4 rounded-full border-2 flex items-center justify-center transition-all shrink-0"
         [class.bg-emerald-600]="isChecked()"
         [class.border-emerald-600]="isChecked()"
         [class.border-gray-300]="!isChecked()">
      @if (isChecked()) {
        <svg class="w-2.5 h-2.5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
        </svg>
      }
    </div>
    <div class="flex flex-col min-w-0"
         [class.line-through]="isChecked()"
         [class.text-gray-400]="isChecked()">
      <span class="font-medium text-sm text-gray-800 dark:text-gray-200 truncate" [class.text-gray-400]="isChecked()">
        {{ item().nameProduct }}
      </span>
      <span class="text-xs text-gray-400 dark:text-gray-500">
        {{ item().quantity | smartUnit:item().unityProduct }}
      </span>
    </div>
  </div>
  <button (click)="$event.stopPropagation(); deleteItem()"
          class="w-5 h-5 rounded-full flex items-center justify-center
                 text-gray-300 dark:text-gray-600 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 transition-all cursor-pointer">
    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
    </svg>
  </button>
</div>
