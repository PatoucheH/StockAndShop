@if (loading()) {
  <div class="flex justify-center items-center py-20">
    <p class="text-green-800 font-semibold animate-pulse">
      Chargement...
    </p>
  </div>
} @else if (selectedShoppingList(); as list) {
  <section class="max-w-2xl mx-auto p-4">
    <div class="mb-6">
      <h2 class="text-2xl font-bold text-green-900">
        {{ list.name }}
      </h2>
    </div>
    <div class="flex flex-col gap-2">
      @for (item of list.products; track item.id) {
        <app-item-shopping-list
          [item]="item">
        </app-item-shopping-list>
      }
      @if (id) {
        <app-form-add-product-shopping-list
          [id]="id">
        </app-form-add-product-shopping-list>
      }
    </div>
    <div class="mt-5">
      <button
        (click)="openModal()"
        class="w-full bg-gradient-to-r from-teal-900 to-green-700 text-white font-semibold
               py-3 rounded-2xl hover:scale-[1.01] transition-all duration-200">
        Le produit n'existe pas le créer
      </button>
    </div>
  </section>
} @else {
  <div class="flex justify-center items-center py-20">
    <p class="text-gray-500">
      Pas d'informations pour cette liste
    </p>
  </div>
}

@if (id && modalIsOpen()) {
  <app-add-product-to-list [id]="id" (closeModal)="closeModal()"></app-add-product-to-list>
}
