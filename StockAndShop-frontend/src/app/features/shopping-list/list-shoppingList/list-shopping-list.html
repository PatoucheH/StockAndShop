<div class="max-w-4xl mx-auto px-4 sm:px-6 py-5">
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
    @for (sl of shoppingList(); track sl.id) {
      <div [routerLink]="['/shopping-list', sl.id]"
           class="group bg-white rounded-2xl p-5 border border-gray-100 shadow-sm
                  hover:shadow-md hover:-translate-y-0.5 transition-all duration-200 cursor-pointer">
        <div class="w-9 h-9 rounded-xl bg-emerald-50 flex items-center justify-center mb-3
                    group-hover:bg-emerald-100 transition-colors">
          <svg class="w-5 h-5 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                  d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
          </svg>
        </div>
        <p class="font-semibold text-gray-900 text-sm leading-snug">{{ sl.name }}</p>
        @if (sl.description) {
          <p class="text-xs text-gray-400 mt-1 line-clamp-2">{{ sl.description }}</p>
        }
        <div class="flex items-center justify-between mt-4">
          <span class="text-xs text-emerald-600 font-medium group-hover:underline">Ouvrir</span>
          <button (click)="$event.stopPropagation(); confirmDelete(sl.id)"
                  class="text-xs text-gray-400 hover:text-red-500 transition-colors cursor-pointer">
            Supprimer
          </button>
        </div>
      </div>
    }
  </div>
</div>

@if (pendingDeleteId() !== null) {
  <app-confirm-modal
    message="Supprimer cette liste de courses ? Cette action est irréversible."
    confirmLabel="Supprimer"
    (confirmed)="onDeleteConfirmed()"
    (cancelled)="pendingDeleteId.set(null)"/>
}
