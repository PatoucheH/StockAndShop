<form [formGroup]="form" (ngSubmit)="addProduct()"
      class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 flex items-center gap-2 shadow-sm overflow-visible">
  <div class="relative flex-1 min-w-0">
    <input type="text" formControlName="nameProduct"
           placeholder="Ajouter un produit..."
           autocomplete="off"
           (focus)="onFocus()"
           (blur)="onBlur()"
           class="w-full bg-transparent outline-none text-sm text-gray-800 dark:text-gray-200 placeholder:text-gray-400 dark:placeholder:text-gray-500"/>
    @if (showDropdown()) {
      <div class="absolute top-full left-0 right-0 z-50 mt-1
                  bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700
                  rounded-xl shadow-lg max-h-52 overflow-y-auto">
        @for (product of filteredProducts(); track product.id) {
          <button type="button"
                  (mousedown)="selectProduct(product.name)"
                  class="w-full text-left px-3 py-2 text-sm text-gray-800 dark:text-gray-200
                         hover:bg-gray-50 dark:hover:bg-gray-700 truncate block first:rounded-t-xl last:rounded-b-xl">
            {{ product.name }}
          </button>
        }
      </div>
    }
  </div>
  @let currentProduct = selectedProduct();
  @if (currentProduct) {
    <div class="flex items-center gap-1.5 shrink-0">
      <input type="number" formControlName="quantity"
             [attr.min]="isWeightOrVolume() ? '0.001' : '1'"
             [attr.step]="isWeightOrVolume() ? 'any' : '1'"
             class="w-14 border border-gray-200 dark:border-gray-600 rounded-lg px-2 py-1.5 text-sm text-center
                    bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100
                    outline-none focus:ring-2 focus:ring-emerald-400 focus:border-transparent"/>
      @if (isWeightOrVolume()) {
        <select (change)="subUnit.set($any($event.target).value)"
                class="text-xs border border-gray-200 dark:border-gray-600 rounded-lg px-1.5 py-1.5
                       bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100
                       outline-none focus:ring-2 focus:ring-emerald-400">
          @for (unit of unitConversion.getSubUnits(currentProduct.unity); track unit) {
            <option [value]="unit">{{ unit }}</option>
          }
        </select>
      } @else {
        <span class="text-xs text-gray-400 dark:text-gray-500 whitespace-nowrap">{{ currentProduct.unity }}</span>
      }
    </div>
  }
  <button type="submit" [disabled]="form.invalid || !currentProduct"
          class="shrink-0 w-8 h-8 flex items-center justify-center rounded-xl text-sm font-bold
                 bg-emerald-600 hover:bg-emerald-700 text-white transition-colors cursor-pointer
                 disabled:opacity-40 disabled:cursor-not-allowed">
    +
  </button>
</form>
