<div class="min-h-screen flex items-center justify-center bg-gray-50">
  <div class="w-full max-w-sm bg-white rounded-2xl shadow-md p-8">
    <h1 class="text-2xl font-semibold text-center text-gray-800 mb-6">Connexion</h1>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
      <div class="flex flex-col gap-1">
        <label class="text-sm text-gray-600" for="email">Email</label>
        <input id="email" type="email" formControlName="email" required
          class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-500"
          placeholder="email@example.com"/>
      </div>
      <div class="flex flex-col gap-1">
        <label class="text-sm text-gray-600" for="password">Mot de passe</label>
        <div class="relative">
          <input id="password" [type]="showPassword() ? 'text' : 'password'" formControlName="password" required
            class="w-full border border-gray-300 rounded-lg px-3 py-2 pr-10 text-sm focus:outline-none focus:ring-2 focus:ring-green-500"
            placeholder="*******"/>
          <button type="button" (click)="showPassword.set(!showPassword())"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
            @if (showPassword()) {
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
              </svg>
            } @else {
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
            }
          </button>
        </div>
      </div>
      @if (error()) {
        <p class="text-sm text-red-500 text-center">{{ error() }}</p>
      }
      @let isLoading = loading();
      <button type="submit" [disabled]="isLoading"
        class="w-full bg-green-700 text-white rounded-lg py-2 text-sm font-medium border
               hover:bg-green-200 hover:text-green-700 hover:border-green-700 disabled:opacity-50 transition-colors">
        {{ isLoading ? 'Connexion...' : 'Se connecter' }}
      </button>
    </form>
    <p class="text-center text-sm text-gray-500 mt-5">
      Pas encore de compte ?
      <a routerLink="/auth/register" class="text-green-600 hover:underline">S'enregistrer</a>
    </p>
  </div>
</div>
