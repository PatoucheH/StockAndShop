<div class="bg-gray-50 dark:bg-gray-700/50 rounded-xl m-2 px-4 py-3 space-y-1.5">
  <div class="flex items-center justify-between gap-2">
    <span class="text-sm font-semibold text-gray-800 dark:text-gray-200 capitalize">
      {{ displayName() }}
    </span>
    <app-star-rating [score]="comment().score" size="sm" />
  </div>
  <p class="text-sm text-gray-600 dark:text-gray-300 leading-relaxed">{{ comment().comment }}</p>
  <p class="text-xs text-gray-400 dark:text-gray-500">{{ comment().createdAt | date:'dd/MM/yyyy' }}</p>
  @if (isOwner()) {
    <button (click)="deleteComment(comment().id)" class="text-red-500">
      Supprimer
    </button>
  }
</div>
