<div class="border-t border-gray-100 dark:border-gray-700 pt-4">
  @if (disabled()) {
    <div class="flex items-center gap-2.5 px-4 py-3 bg-emerald-50 dark:bg-emerald-900/20
                rounded-xl border border-emerald-100 dark:border-emerald-800">
      <svg class="w-4 h-4 text-emerald-600 dark:text-emerald-400 shrink-0" fill="none"
           viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
      </svg>
      <p class="text-sm text-emerald-700 dark:text-emerald-300">Vous avez déjà noté cette recette.</p>
    </div>
  } @else {
    <div class="space-y-3">
      <h4 class="text-xs font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wider">
        Laisser un avis
      </h4>

      <!-- Star picker -->
      <div class="flex items-center gap-1">
        @for (star of stars; track star) {
          <button type="button"
                  (mouseenter)="hoveredScore.set(star)"
                  (mouseleave)="hoveredScore.set(0)"
                  (click)="score.set(star)"
                  class="cursor-pointer">
            <svg class="w-7 h-7 transition-colors"
                 [class]="star <= (hoveredScore() || score()) ? 'text-amber-400' : 'text-gray-300 dark:text-gray-600'"
                 fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
            </svg>
          </button>
        }
      </div>

      <!-- Textarea -->
      <textarea
        [ngModel]="commentText()"
        (ngModelChange)="commentText.set($event)"
        placeholder="Partagez votre expérience..."
        rows="3"
        class="w-full text-sm rounded-xl border border-gray-200 dark:border-gray-600
               bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200
               placeholder-gray-400 dark:placeholder-gray-500
               px-3 py-2 resize-none focus:outline-none focus:ring-2 focus:ring-emerald-500">
      </textarea>

      <!-- Submit -->
      <button type="button"
              (click)="submit()"
              [disabled]="score() === 0 || !commentText().trim() || isSubmitting()"
              class="w-full py-2 rounded-xl text-sm font-semibold transition-colors cursor-pointer
                     bg-emerald-600 hover:bg-emerald-700 text-white
                     disabled:opacity-50 disabled:cursor-not-allowed">
        {{ isSubmitting() ? 'Envoi en cours...' : 'Publier' }}
      </button>
    </div>
  }
</div>
