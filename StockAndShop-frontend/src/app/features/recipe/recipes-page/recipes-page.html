<div class="max-w-2xl mx-auto px-4 sm:px-6 py-8">
  <div class="mb-6">
    <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Recettes</h1>
    <p class="text-sm text-gray-500 mt-0.5">Découvrez des idées de repas</p>
  </div>
  <div class="flex bg-gray-100 rounded-xl p-1 gap-1 mb-6">
    <button type="button" (click)="showFavorites.set(true)"
            class="flex-1 py-2 px-4 rounded-lg text-sm font-medium transition-colors cursor-pointer"
            [class]="showFavorites() ? 'bg-white text-gray-900 shadow-sm' : 'text-gray-500 hover:text-gray-700'">
      Mes favoris
    </button>
    <button type="button" (click)="showFavorites.set(false)"
            class="flex-1 py-2 px-4 rounded-lg text-sm font-medium transition-colors cursor-pointer"
            [class]="!showFavorites() ? 'bg-white text-gray-900 shadow-sm' : 'text-gray-500 hover:text-gray-700'">
      Toutes les recettes
    </button>
  </div>

  <app-list-recipes
    [recipes]="currentRecipes()"
    [isLoading]="currentIsLoading()"
    [hasError]="currentHasError()"
    [hasMore]="currentHasMore()"
    (loadMore)="onLoadMore()">
  </app-list-recipes>
</div>
