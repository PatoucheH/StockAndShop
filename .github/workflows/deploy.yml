name: Build & deploy to Raspberry Pi

on:
  push:
    branches: [main]
    paths:
      - 'StockAndShop-backend/**'
      - 'StockAndShop-frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# One deploy at a time; a newer push cancels the one in progress
concurrency:
  group: deploy-stockandshop
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: patoucheh   # GHCR namespace (lowercase GitHub owner)

jobs:
  # ---------------------------------------------------------------------------
  # 1) Build the images on GitHub's native ARM64 runners and push them to GHCR.
  #    The Raspberry Pi never compiles anything anymore.
  # ---------------------------------------------------------------------------
  build:
    name: Build & push ${{ matrix.image }}
    runs-on: ubuntu-24.04-arm      # native ARM64 (free for public repos) -> matches the Pi
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: stockandshop-backend
            context: ./StockAndShop-backend
          - image: stockandshop-frontend
            context: ./StockAndShop-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # ---------------------------------------------------------------------------
  # 2) On the Pi: just pull the fresh images and restart. No build.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy on the Pi
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PI_HOST }}
          username: ${{ secrets.PI_USER }}
          key: ${{ secrets.PI_SSH_KEY }}
          port: 2222
          command_timeout: 10m
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            # Authenticate to GHCR with the ephemeral workflow token (images stay private)
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            cd /opt/stockandshop
            git fetch --all --prune
            git checkout main
            git reset --hard origin/main

            docker compose pull
            docker compose up -d

            echo "Attente du démarrage du backend..."
            ok=0
            for i in $(seq 1 40); do
              if curl -sf http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
                ok=1; echo "Backend UP après $((i * 3))s"; break
              fi
              sleep 3
            done

            docker logout ghcr.io || true

            if [ "$ok" -ne 1 ]; then
              echo "ECHEC : le backend n'a pas atteint UP en 120s"
              docker compose logs --tail=40 backend
              exit 1
            fi

            docker image prune -f
            echo "Déploiement terminé."
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
