# Codemagic — build iOS de StockAndShop (Capacitor + Angular) -> TestFlight
# L'Android est buildé en local (Android Studio), donc ce workflow ne gère QUE l'iOS.
#
# PRÉREQUIS (à faire une fois, côté Apple / Codemagic) :
#   1. App Store Connect : créer l'app "Stock&Shop" avec le Bundle ID com.patoutech.stockandshop
#   2. Codemagic : avoir une intégration "App Store Connect API key" (tu en as déjà une pour makeyourbrain)
#      -> remplace <APP_STORE_CONNECT_KEY> ci-dessous par SON NOM exact dans Codemagic
#   3. (rien à committer côté ios/ : le dossier iOS est généré dans le pipeline via `cap add ios`)

workflows:
  ios-stockandshop:
    name: StockAndShop iOS -> TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic   # clé API App Store Connect (Key: MVVLT47P67)
    environment:
      vars:
        BUNDLE_ID: "com.patoutech.stockandshop"
        XCODE_WORKSPACE: "StockAndShop-frontend/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
      cocoapods: default

    scripts:
      - name: Installer les dépendances npm
        script: |
          cd StockAndShop-frontend
          npm ci

      - name: Build web (configuration capacitor)
        script: |
          cd StockAndShop-frontend
          npx ng build --configuration capacitor

      - name: Générer le projet iOS + sync
        script: |
          cd StockAndShop-frontend
          [ -d ios ] || npx cap add ios
          npx cap sync ios

      - name: Ajouter la permission caméra (Info.plist)
        script: |
          PLIST="StockAndShop-frontend/ios/App/App/Info.plist"
          MSG="Stock&Shop utilise la caméra pour scanner les codes-barres des produits."
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string \"$MSG\"" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription \"$MSG\"" "$PLIST"

      - name: Pods (si CocoaPods) + cible iOS 15.5
        script: |
          cd StockAndShop-frontend
          PODFILE=$(find ios -name Podfile | head -1)
          if [ -n "$PODFILE" ]; then
            echo "CocoaPods détecté : $PODFILE"
            # ML Kit (scanner natif) exige iOS >= 15.5
            sed -i '' "s/platform :ios, '.*'/platform :ios, '15.5'/" "$PODFILE" || true
            ( cd "$(dirname "$PODFILE")" && pod install )
          else
            echo "Pas de Podfile -> projet en Swift Package Manager, rien à installer ici."
            echo "Structure ios/ :"; find ios -maxdepth 3 | head -60
          fi

      - name: Numéro de build
        script: |
          cd StockAndShop-frontend/ios/App
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Signature iOS (crée le profil via la clé API + certificat existant)
        script: |
          keychain initialize
          # Crée le profil de provisioning App Store pour le bundle ID s'il n'existe pas,
          # et récupère ton certificat de distribution déjà présent sur le compte Apple.
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build de l'IPA
        script: |
          cd StockAndShop-frontend
          WS=$(find ios -maxdepth 3 -name "*.xcworkspace" | head -1)
          if [ -n "$WS" ]; then
            echo "Build via workspace : $WS"
            xcode-project build-ipa --workspace "$WS" --scheme "$XCODE_SCHEME"
          else
            PROJ=$(find ios -maxdepth 3 -name "*.xcodeproj" | head -1)
            echo "Build via projet : $PROJ"
            xcode-project build-ipa --project "$PROJ" --scheme "$XCODE_SCHEME"
          fi

    artifacts:
      - StockAndShop-frontend/build/ios/ipa/*.ipa
      - "**/*.ipa"
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Laisse false tant que tu n'as pas rempli la fiche App Store ; passe à true pour soumettre en review
        submit_to_app_store: false
